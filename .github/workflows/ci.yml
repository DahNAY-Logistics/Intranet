name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intranet_test?schema=public

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intranet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: make install-ci

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: make lint-commits LINT_COMMITS_FROM=origin/${{ github.base_ref }}

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Build client
        run: make build

      - name: Component tests
        run: make test-client

      - name: Configure e2e environment
        run: |
          make e2e-env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DATABASE_URL|" e2e/.env.test
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" e2e/.env.test

      - name: E2E tests
        run: make ci-test-e2e
