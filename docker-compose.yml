services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see server/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-intranet}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-intranet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intranet}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
